<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>แบบสำรวจกิจกรรม — TDFB</title>
<link rel="stylesheet" href="/shared.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div id="who" class="who"></div>
      <button class="btn secondary" id="logoutBtn" style="font-size:12.5px; padding:7px 12px;">ออกจากระบบ</button>
    </div>

    <div id="content">
      <p class="sub">กำลังโหลด...</p>
    </div>
  </div>

<script>
let ACTIVITIES = [];

async function boot() {
  const me = await fetch("/api/me");
  if (!me.ok) { location.href = "/login.html"; return; }
  const meData = await me.json();
  document.getElementById("who").innerHTML =
    (meData.user.picture ? '<img src="' + meData.user.picture + '" alt="">' : "") +
    "<span>" + meData.user.name + "</span>";
  document.getElementById("logoutBtn").onclick = async () => {
    await fetch("/api/auth/logout", { method: "POST" });
    location.href = "/login.html";
  };

  const res = await fetch("/api/activities/open");
  const content = document.getElementById("content");
  if (!res.ok) {
    const err = await res.json();
    content.innerHTML = '<div class="notice info">' + (err.error || "ยังไม่มีแบบสำรวจที่เปิดอยู่ในขณะนี้") + "</div>";
    return;
  }
  const data = await res.json();
  ACTIVITIES = data.activities;

  if (!ACTIVITIES.length) {
    content.innerHTML = '<div class="notice info">ยังไม่มีแบบสำรวจที่เปิดอยู่ในขณะนี้ — กลับมาดูใหม่ตอนมีกิจกรรมถัดไปนะครับ</div>';
    return;
  }

  content.innerHTML =
    '<p class="eyebrow">' + ACTIVITIES.length + " แบบสำรวจที่เปิดอยู่ตอนนี้</p>" +
    '<h1 style="margin-bottom:20px;">ตอบแบบสำรวจ</h1>' +
    '<div id="cards"></div>';

  const cardsEl = document.getElementById("cards");
  ACTIVITIES.forEach((activity) => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "activity-" + activity.id;
    cardsEl.appendChild(card);
    renderCard(activity);
  });
}

function renderCard(activity) {
  const card = document.getElementById("activity-" + activity.id);
  const previous = activity.previousResponse;
  const answers = (previous && previous.answers) || {};

  const topicsHtml = activity.topics.map((t) => {
    const buttons = [1, 2, 3, 4, 5].map((n) =>
      '<button type="button" data-val="' + n + '" class="' +
      (answers[t.key] === n ? "selected" : "") + '">' + n + "</button>"
    ).join("");
    return (
      '<div class="topic-row">' +
        "<label>" + t.label + "</label>" +
        '<div class="rating" data-topic="' + t.key + '">' + buttons + "</div>" +
      "</div>"
    );
  }).join("");

  card.innerHTML =
    '<p class="eyebrow">' + activity.quarter + '</p>' +
    '<h2 style="font-size:18px; margin:0 0 4px;">' + activity.name + "</h2>" +
    '<p class="sub" style="margin-bottom:16px;">ให้คะแนนแต่ละหัวข้อ 1–5 (5 คือมากที่สุด)' +
    (previous ? " · คุณเคยตอบแล้ว ส่งซ้ำจะแก้ไขคำตอบเดิม" : "") + "</p>" +
    topicsHtml +
    '<div class="field" style="margin-top:16px;">' +
      "<label>สิ่งที่ประทับใจ / ชื่นชมมากที่สุด</label>" +
      '<textarea rows="3" data-field="praise">' + (previous?.praise || "") + "</textarea>" +
    "</div>" +
    '<div class="field">' +
      "<label>ข้อเสนอแนะสำหรับครั้งถัดไป</label>" +
      '<textarea rows="3" data-field="ask">' + (previous?.ask || "") + "</textarea>" +
    "</div>" +
    '<div class="notice error" data-role="formError" style="display:none;"></div>' +
    '<button class="btn" data-role="submitBtn">ส่งคำตอบ</button>';

  card.querySelectorAll(".rating").forEach((group) => {
    group.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        group.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });
  });

  card.querySelector('[data-role="submitBtn"]').addEventListener("click", () => submit(activity, card));
}

async function submit(activity, card) {
  const answers = {};
  card.querySelectorAll(".rating").forEach((group) => {
    const selected = group.querySelector("button.selected");
    if (selected) answers[group.dataset.topic] = Number(selected.dataset.val);
  });

  const errBox = card.querySelector('[data-role="formError"]');
  if (Object.keys(answers).length < activity.topics.length) {
    errBox.textContent = "กรุณาให้คะแนนครบทุกหัวข้อ";
    errBox.style.display = "block";
    return;
  }
  errBox.style.display = "none";

  const submitBtn = card.querySelector('[data-role="submitBtn"]');
  submitBtn.disabled = true;
  submitBtn.textContent = "กำลังส่ง...";

  const res = await fetch("/api/responses", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      activityId: activity.id,
      answers,
      praise: card.querySelector('[data-field="praise"]').value.trim(),
      ask: card.querySelector('[data-field="ask"]').value.trim(),
    }),
  });

  if (!res.ok) {
    const err = await res.json();
    errBox.textContent = err.error || "ส่งคำตอบไม่สำเร็จ ลองอีกครั้ง";
    errBox.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "ส่งคำตอบ";
    return;
  }

  card.innerHTML =
    '<p class="eyebrow">' + activity.quarter + '</p>' +
    '<h2 style="font-size:18px; margin:0 0 6px;">' + activity.name + "</h2>" +
    '<p class="sub" style="margin:0;">บันทึกคำตอบแล้ว 🎉 ขอบคุณครับ/ค่ะ</p>';
}

window.addEventListener("load", boot);
</script>
</body>
</html>
