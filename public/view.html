<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Village Builders Scoreboard — View</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .view-score { display: flex; align-items: baseline; gap: 4px; }
  .view-points { font-weight: 900; font-variant-numeric: tabular-nums; font-size: 1.5rem; color: var(--ink); }
  .view-pts-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }

  .live-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 700; color: var(--ink-soft);
    background: var(--toolbar-bg); padding: 5px 12px; border-radius: 999px; margin-top: 8px;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf6a; box-shadow: 0 0 0 0 rgba(76,175,106,0.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(76,175,106,0.5); } 70% { box-shadow: 0 0 0 6px rgba(76,175,106,0); } 100% { box-shadow: 0 0 0 0 rgba(76,175,106,0); } }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }

  /* Floating feed widget — fixed positioning keeps it out of normal flow entirely,
     so it never affects the board's centering or size. */
  .feed-widget { position: fixed; right: clamp(10px, 2vw, 24px); bottom: clamp(10px, 2vw, 24px); z-index: 15; }

  .feed-toggle {
    display: flex; align-items: center; gap: 8px; font: inherit; font-size: 0.82rem; font-weight: 700; color: var(--ink);
    background: color-mix(in srgb, var(--card-bg) 78%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--card-border); border-radius: 999px; padding: 9px 16px; cursor: pointer;
    box-shadow: 0 6px 16px var(--panel-shadow);
  }
  .feed-toggle:hover { color: var(--title-stroke); }
  .feed-count { background: #e6536b; color: #fff; font-size: 0.68rem; font-weight: 800; border-radius: 999px; padding: 1px 7px; min-width: 1.4em; text-align: center; }

  .feed-panel {
    position: absolute; right: 0; bottom: calc(100% + 10px); width: min(320px, 82vw); max-height: min(60vh, 460px);
    background: color-mix(in srgb, var(--card-bg) 80%, transparent); backdrop-filter: blur(10px);
    border: 1px solid var(--card-border); border-radius: 18px; padding: 14px 16px 16px;
    box-shadow: 0 12px 28px var(--panel-shadow); display: none; flex-direction: column;
  }
  .feed-widget.open .feed-panel { display: flex; }
  .feed-widget.open .feed-toggle { box-shadow: 0 2px 8px var(--panel-shadow); }

  .feed-panel h2 { margin: 0 0 4px; font-size: 0.92rem; color: var(--ink); }
  .feed-sub { margin: 0 0 10px; font-size: 0.7rem; color: var(--ink-soft); }
  .feed-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .feed-item { font-size: 0.83rem; color: var(--ink); line-height: 1.4; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); animation: feedIn 0.35s ease; }
  .feed-item:last-child { border-bottom: none; padding-bottom: 0; }
  .feed-time { display: block; font-size: 0.68rem; color: var(--ink-soft); margin-top: 2px; }
  .feed-empty { font-size: 0.82rem; color: var(--ink-soft); }
  @keyframes feedIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .feed-item { animation: none; } }
</style>
</head>
<body>
  <div class="scene-sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud--a"></div>
    <div class="cloud cloud--b"></div>
    <div class="cloud cloud--c"></div>
    <svg class="hills" viewBox="0 0 1440 220" preserveAspectRatio="none" style="height: clamp(120px, 20vw, 220px);">
      <path d="M0,120 C240,60 420,170 720,110 C1000,55 1220,150 1440,90 L1440,220 L0,220 Z" fill="var(--hill-far)"></path>
      <path d="M0,180 C260,130 500,210 760,160 C1040,105 1260,200 1440,150 L1440,220 L0,220 Z" fill="var(--hill-near)"></path>
    </svg>
  </div>

  <div class="page">
    <div class="title-wrap">
      <h1 class="board-title" id="boardTitle">Village Builders Scoreboard</h1>
      <div class="live-badge"><span class="live-dot"></span><span id="lastUpdated">กำลังเชื่อมต่อ…</span></div>
    </div>

    <div class="board" id="board"></div>
  </div>

  <div class="feed-widget" id="feedWidget">
    <div class="feed-panel">
      <h2>อัปเดตล่าสุด</h2>
      <p class="feed-sub">รายการเปลี่ยนแปลงระยะทางและหมู่บ้านแบบเรียลไทม์</p>
      <ul class="feed-list" id="feedList"></ul>
    </div>
    <button type="button" class="feed-toggle" id="feedToggle">
      <span>🔔 อัปเดตล่าสุด</span>
      <span class="feed-count" id="feedCount" hidden>0</span>
    </button>
  </div>

  <script src="shared.js"></script>
  <script src="view.js"></script>
</body>
</html>
