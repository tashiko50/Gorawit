<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Village Builders Scoreboard</title>
<style>
  :root {
    --sky-top: #eaf6ff;
    --sky-bottom: #bfe3f5;
    --sun: #ffe18c;
    --sun-glow: #fff3c4;
    --hill-far: #8fcb6b;
    --hill-near: #6fae4e;
    --cloud: #ffffff;
    --cloud-shadow: rgba(180, 210, 230, 0.6);
    --ink: #2b3a4a;
    --ink-soft: #5b7086;
    --card-bg: #ffffff;
    --card-border: rgba(43, 58, 74, 0.14);
    --title-stroke: #2f6fb0;
    --panel-shadow: rgba(43, 58, 74, 0.2);
    --toolbar-bg: rgba(255, 255, 255, 0.65);
    --star-hint: rgba(43, 58, 74, 0.35);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --sky-top: #0b1734;
      --sky-bottom: #1b2c52;
      --sun: #f4e6b8;
      --sun-glow: rgba(244, 230, 184, 0.28);
      --hill-far: #204a2c;
      --hill-near: #143820;
      --cloud: rgba(255, 255, 255, 0.16);
      --cloud-shadow: rgba(0, 0, 0, 0.25);
      --ink: #edf2f8;
      --ink-soft: #aebbcc;
      --card-bg: #202c4a;
      --card-border: rgba(237, 242, 248, 0.16);
      --title-stroke: #7fb6f5;
      --panel-shadow: rgba(0, 0, 0, 0.5);
      --toolbar-bg: rgba(15, 22, 44, 0.6);
      --star-hint: rgba(237, 242, 248, 0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="light"] {
    --sky-top: #eaf6ff; --sky-bottom: #bfe3f5; --sun: #ffe18c; --sun-glow: #fff3c4;
    --hill-far: #8fcb6b; --hill-near: #6fae4e; --cloud: #ffffff; --cloud-shadow: rgba(180, 210, 230, 0.6);
    --ink: #2b3a4a; --ink-soft: #5b7086; --card-bg: #ffffff; --card-border: rgba(43, 58, 74, 0.14);
    --title-stroke: #2f6fb0; --panel-shadow: rgba(43, 58, 74, 0.2); --toolbar-bg: rgba(255, 255, 255, 0.65);
    --star-hint: rgba(43, 58, 74, 0.35); color-scheme: light;
  }
  :root[data-theme="dark"] {
    --sky-top: #0b1734; --sky-bottom: #1b2c52; --sun: #f4e6b8; --sun-glow: rgba(244, 230, 184, 0.28);
    --hill-far: #204a2c; --hill-near: #143820; --cloud: rgba(255, 255, 255, 0.16); --cloud-shadow: rgba(0, 0, 0, 0.25);
    --ink: #edf2f8; --ink-soft: #aebbcc; --card-bg: #202c4a; --card-border: rgba(237, 242, 248, 0.16);
    --title-stroke: #7fb6f5; --panel-shadow: rgba(0, 0, 0, 0.5); --toolbar-bg: rgba(15, 22, 44, 0.6);
    --star-hint: rgba(237, 242, 248, 0.3); color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%);
    overflow-x: hidden;
    position: relative;
  }

  .scene-sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .sun {
    position: absolute;
    top: 6%;
    left: 50%;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--sun) 0%, var(--sun-glow) 60%, transparent 72%);
    transform: translateX(-50%);
    filter: blur(0.5px);
  }

  .cloud {
    position: absolute;
    background: var(--cloud);
    border-radius: 100px;
    box-shadow: 0 10px 18px var(--cloud-shadow);
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 100px;
  }
  .cloud--a { width: 120px; height: 40px; top: 10%; left: -10%; animation-duration: 70s; }
  .cloud--a::before { width: 60px; height: 60px; top: -30px; left: 10px; }
  .cloud--a::after { width: 50px; height: 50px; top: -20px; left: 55px; }
  .cloud--b { width: 90px; height: 32px; top: 20%; left: -10%; animation-duration: 95s; animation-delay: -30s; }
  .cloud--b::before { width: 46px; height: 46px; top: -22px; left: 8px; }
  .cloud--b::after { width: 38px; height: 38px; top: -16px; left: 44px; }
  .cloud--c { width: 100px; height: 34px; top: 6%; left: -10%; animation-duration: 80s; animation-delay: -55s; }
  .cloud--c::before { width: 50px; height: 50px; top: -24px; left: 10px; }
  .cloud--c::after { width: 42px; height: 42px; top: -18px; left: 48px; }

  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(140vw); }
  }

  .hills {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: 100%;
    display: block;
  }

  @media (prefers-reduced-motion: reduce) {
    .cloud { animation: none; }
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(20px, 4vw, 48px) clamp(16px, 5vw, 56px) 64px;
  }

  .title-wrap {
    text-align: center;
    margin-bottom: clamp(28px, 4vw, 44px);
  }

  h1.board-title {
    font-size: clamp(1.6rem, 4vw, 2.7rem);
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    -webkit-text-stroke: 3px var(--title-stroke);
    paint-order: stroke fill;
    text-wrap: balance;
    margin: 0;
    padding: 4px 10px;
    outline: none;
    cursor: text;
  }
  h1.board-title:hover, h1.board-title:focus-visible {
    outline: 2px dashed var(--title-stroke);
    outline-offset: 6px;
    border-radius: 10px;
  }
  .title-hint {
    margin-top: 6px;
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  .board {
    width: 100%;
    max-width: 1180px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(18px, 2.4vw, 30px);
  }

  .team-card {
    --accent-tint: color-mix(in srgb, var(--accent, #4a90d9) 20%, var(--card-bg));
    --accent-soft: color-mix(in srgb, var(--accent, #4a90d9) 45%, white);
    --accent-deep: color-mix(in srgb, var(--accent, #4a90d9) 70%, black);
    position: relative;
    width: 232px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 14px 16px;
    border-radius: 22px;
    transition: transform 0.15s ease;
  }
  .team-card:hover { transform: translateY(-3px); }

  .remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--ink-soft);
    box-shadow: 0 2px 6px var(--panel-shadow);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .team-card:hover .remove-btn, .remove-btn:focus-visible { opacity: 1; }
  .remove-btn:hover { background: #e6536b; color: #fff; }

  .team-name {
    font-weight: 800;
    font-size: 1.02rem;
    color: var(--accent-deep);
    text-align: center;
    outline: none;
    padding: 2px 8px;
    border-radius: 8px;
    margin-bottom: 10px;
    max-width: 100%;
    overflow-wrap: break-word;
    cursor: text;
  }
  .team-name:hover, .team-name:focus-visible {
    outline: 2px dashed var(--accent-soft);
  }

  .palette {
    display: flex;
    gap: 5px;
    margin-bottom: 12px;
  }
  .palette button {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--card-bg);
    box-shadow: 0 0 0 1px var(--card-border);
    cursor: pointer;
    padding: 0;
  }
  .palette button[aria-pressed="true"] {
    box-shadow: 0 0 0 2px var(--ink);
  }

  .house {
    position: relative;
    width: 150px;
    height: 128px;
    margin-bottom: 14px;
  }
  .house .roof {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 78px solid transparent;
    border-right: 78px solid transparent;
    border-bottom: 56px solid var(--accent, #4a90d9);
    filter: drop-shadow(0 3px 0 var(--accent-deep));
  }
  .house .chimney {
    position: absolute;
    top: 6px; right: 30px;
    width: 14px; height: 26px;
    background: var(--accent-deep);
    border-radius: 2px 2px 0 0;
  }
  .house .wall {
    position: absolute;
    top: 50px; left: 12px; right: 12px; bottom: 0;
    background: var(--accent-tint);
    border: 2px solid var(--accent-soft);
    border-radius: 0 0 14px 14px;
  }
  .house .window {
    position: absolute;
    top: 62px; left: 50%;
    transform: translateX(-50%);
    width: 34px; height: 34px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 12%, white);
    border: 3px solid var(--accent-soft);
  }
  .house .window::before, .house .window::after {
    content: "";
    position: absolute;
    background: var(--accent-soft);
  }
  .house .window::before { top: 50%; left: 3px; right: 3px; height: 2px; transform: translateY(-50%); }
  .house .window::after { left: 50%; top: 3px; bottom: 3px; width: 2px; transform: translateX(-50%); }
  .house .door {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 44px;
    background: var(--accent-deep);
    border-radius: 8px 8px 0 0;
  }
  .house .door::after {
    content: "";
    position: absolute;
    right: 5px; top: 50%;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent-tint);
  }
  .house .accessory {
    position: absolute;
    top: -20px;
    right: 6px;
    width: 30px;
    height: 30px;
    color: var(--accent-deep);
  }
  .house .accessory svg { width: 100%; height: 100%; overflow: visible; }

  .score-card {
    width: 100%;
    background: var(--accent-tint);
    border: 2px solid var(--accent-soft);
    border-radius: 16px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    box-shadow: 0 4px 10px var(--panel-shadow);
  }

  .points-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .step-btn {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--accent-deep);
    font-weight: 800;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 1px 3px var(--panel-shadow);
  }
  .step-btn:active { transform: scale(0.92); }

  .points-input {
    width: 54px;
    font: inherit;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem;
    color: var(--ink);
    background: transparent;
    border: none;
    text-align: center;
    -moz-appearance: textfield;
  }
  .points-input::-webkit-outer-spin-button,
  .points-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .points-input:hover, .points-input:focus-visible {
    outline: 2px dashed var(--accent-soft);
    border-radius: 6px;
  }
  .pts-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    align-self: flex-end;
    margin-bottom: 4px;
  }

  .token-group {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    border-radius: 10px;
    padding: 4px 6px;
  }
  .token-group:hover, .token-group:focus-within {
    outline: 2px dashed var(--accent-soft);
  }
  .token-icon { width: 26px; height: 26px; flex-shrink: 0; }
  .token-count {
    width: 30px;
    font: inherit;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-size: 0.9rem;
    color: var(--ink);
    background: transparent;
    border: none;
    text-align: center;
    -moz-appearance: textfield;
  }
  .token-count::-webkit-outer-spin-button,
  .token-count::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .token-cycle {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    display: flex;
  }

  .add-card {
    width: 232px;
    min-height: 250px;
    border-radius: 22px;
    border: 2px dashed var(--card-border);
    background: transparent;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .add-card:hover, .add-card:focus-visible {
    border-color: var(--ink-soft);
    color: var(--ink);
    background: var(--toolbar-bg);
  }
  .add-card .plus-circle {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--card-bg);
    box-shadow: 0 2px 8px var(--panel-shadow);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    font-weight: 800;
  }

  .toolbar {
    margin-top: clamp(24px, 4vw, 40px);
    display: flex;
    gap: 10px;
    background: var(--toolbar-bg);
    backdrop-filter: blur(6px);
    padding: 8px;
    border-radius: 14px;
  }
  .toolbar button {
    font: inherit;
    font-weight: 700;
    font-size: 0.82rem;
    border: none;
    background: var(--card-bg);
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 2px 6px var(--panel-shadow);
  }
  .toolbar button:hover { color: var(--title-stroke); }
  .toolbar button:focus-visible, .step-btn:focus-visible, .token-cycle:focus-visible, .palette button:focus-visible, .remove-btn:focus-visible {
    outline: 2px solid var(--title-stroke);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="scene-sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud--a"></div>
    <div class="cloud cloud--b"></div>
    <div class="cloud cloud--c"></div>
    <svg class="hills" viewBox="0 0 1440 220" preserveAspectRatio="none" style="height: clamp(120px, 20vw, 220px);">
      <path d="M0,120 C240,60 420,170 720,110 C1000,55 1220,150 1440,90 L1440,220 L0,220 Z" fill="var(--hill-far)"></path>
      <path d="M0,180 C260,130 500,210 760,160 C1040,105 1260,200 1440,150 L1440,220 L0,220 Z" fill="var(--hill-near)"></path>
    </svg>
  </div>

  <div class="page">
    <div class="title-wrap">
      <h1 class="board-title" contenteditable="true" spellcheck="false" id="boardTitle">Village Builders Scoreboard</h1>
      <div class="title-hint">คลิกที่ชื่อ ทีม แต้ม หรือหัวข้อ เพื่อแก้ไขได้ทันที</div>
    </div>

    <div class="board" id="board"></div>

    <div class="toolbar">
      <button id="addTeamBtn" type="button">+ เพิ่มทีม</button>
      <button id="resetBtn" type="button">รีเซ็ตคะแนน</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "villageScoreboardState.v1";
  var PALETTE = ["#4A90D9", "#E2934A", "#4F9A5B", "#D1587A", "#8B6FD1", "#3FA9A0"];
  var TOKEN_TYPES = ["star", "coin", "coins", "chest"];

  var TOKEN_ICONS = {
    star: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5l2.7 6.35 6.9.6-5.2 4.6 1.6 6.8L12 17.6l-6 3.25 1.6-6.8-5.2-4.6 6.9-.6L12 2.5z" fill="#F4C542" stroke="#B8862A" stroke-width="1" stroke-linejoin="round"/></svg>',
    coin: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="#F6D25C" stroke="#B8862A" stroke-width="1.4"/><circle cx="12" cy="12" r="5.4" fill="none" stroke="#B8862A" stroke-width="1"/></svg>',
    coins: '<svg viewBox="0 0 24 24" fill="none"><ellipse cx="9" cy="16" rx="7" ry="3" fill="#F6D25C" stroke="#B8862A" stroke-width="1.1"/><ellipse cx="9" cy="13" rx="7" ry="3" fill="#F8DA72" stroke="#B8862A" stroke-width="1.1"/><ellipse cx="12" cy="9.5" rx="7" ry="3" fill="#F6D25C" stroke="#B8862A" stroke-width="1.1"/></svg>',
    chest: '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="10" width="18" height="10" rx="1.5" fill="#B8752E" stroke="#7A4A18" stroke-width="1.2"/><path d="M3 10.5c0-3 4-5.5 9-5.5s9 2.5 9 5.5" fill="#D68F3F" stroke="#7A4A18" stroke-width="1.2"/><rect x="10" y="10.5" width="4" height="4" rx="0.8" fill="#F4C542" stroke="#7A4A18" stroke-width="1"/></svg>'
  };

  var ACCESSORY_ICONS = {
    star: '<svg viewBox="0 0 30 30" fill="none"><path d="M15 3v13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 3l9 5-9 3z" fill="currentColor"/></svg>',
    coin: '<svg viewBox="0 0 30 30" fill="none"><text x="6" y="14" font-size="13" font-weight="900" fill="currentColor">?</text><text x="17" y="24" font-size="10" font-weight="900" fill="currentColor">?</text></svg>',
    coins: '<svg viewBox="0 0 30 30" fill="none"><path d="M6 24C4 16 8 6 15 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="10" cy="12" rx="4" ry="2.4" fill="currentColor"/><ellipse cx="6" cy="20" rx="3.4" ry="2" fill="currentColor"/></svg>',
    chest: '<svg viewBox="0 0 30 30" fill="none"><path d="M15 6l2.6 5.3 5.9.8-4.3 4.1 1 5.8L15 19l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8L15 6z" fill="currentColor"/></svg>'
  };

  function defaultTeams() {
    return [
      { id: "t1", name: "Team “spacex”", color: PALETTE[0], points: 0, tokenType: "star", tokenCount: 0 },
      { id: "t2", name: "Team “yes-or-no”", color: PALETTE[1], points: 0, tokenType: "coin", tokenCount: 0 },
      { id: "t3", name: "Team “lerd-lerd”", color: PALETTE[2], points: 0, tokenType: "coins", tokenCount: 0 },
      { id: "t4", name: "Team “plain-flavor-stars”", color: PALETTE[3], points: 0, tokenType: "chest", tokenCount: 0 }
    ];
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { title: "Village Builders Scoreboard", teams: defaultTeams() };
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.teams)) throw new Error("bad shape");
      return parsed;
    } catch (e) {
      return { title: "Village Builders Scoreboard", teams: defaultTeams() };
    }
  }

  var state = loadState();
  var nextIdCounter = state.teams.reduce(function (max, t) {
    var n = parseInt(String(t.id).replace(/\D/g, ""), 10);
    return isNaN(n) ? max : Math.max(max, n);
  }, 0) + 1;

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  function findTeam(id) {
    for (var i = 0; i < state.teams.length; i++) if (state.teams[i].id === id) return state.teams[i];
    return null;
  }

  var boardEl = document.getElementById("board");
  var titleEl = document.getElementById("boardTitle");

  titleEl.textContent = state.title;
  titleEl.addEventListener("input", function () {
    state.title = titleEl.textContent.trim() || "Village Builders Scoreboard";
    save();
  });
  titleEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); titleEl.blur(); }
  });

  function buildCard(team) {
    var card = document.createElement("div");
    card.className = "team-card";
    card.style.setProperty("--accent", team.color);

    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "remove-btn";
    removeBtn.setAttribute("aria-label", "ลบทีมนี้");
    removeBtn.textContent = "×";
    removeBtn.addEventListener("click", function () {
      state.teams = state.teams.filter(function (t) { return t.id !== team.id; });
      save();
      renderBoard();
    });
    card.appendChild(removeBtn);

    var nameEl = document.createElement("div");
    nameEl.className = "team-name";
    nameEl.contentEditable = "true";
    nameEl.spellcheck = false;
    nameEl.textContent = team.name;
    nameEl.addEventListener("input", function () {
      var t = findTeam(team.id);
      if (t) { t.name = nameEl.textContent.trim() || "New Team"; save(); }
    });
    nameEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); nameEl.blur(); }
    });
    card.appendChild(nameEl);

    var palette = document.createElement("div");
    palette.className = "palette";
    PALETTE.forEach(function (hex) {
      var dot = document.createElement("button");
      dot.type = "button";
      dot.style.background = hex;
      dot.setAttribute("aria-label", "สี " + hex);
      dot.setAttribute("aria-pressed", String(hex.toLowerCase() === team.color.toLowerCase()));
      dot.addEventListener("click", function () {
        var t = findTeam(team.id);
        if (!t) return;
        t.color = hex;
        card.style.setProperty("--accent", hex);
        Array.prototype.forEach.call(palette.children, function (child) {
          child.setAttribute("aria-pressed", String(child === dot));
        });
        save();
      });
      palette.appendChild(dot);
    });
    card.appendChild(palette);

    var house = document.createElement("div");
    house.className = "house";
    var accessory = document.createElement("div");
    accessory.className = "accessory";
    accessory.innerHTML = ACCESSORY_ICONS[team.tokenType] || ACCESSORY_ICONS.star;
    house.innerHTML =
      '<div class="roof"></div><div class="chimney"></div>' +
      '<div class="wall"><div class="window"></div><div class="door"></div></div>';
    house.appendChild(accessory);
    card.appendChild(house);

    var scoreCard = document.createElement("div");
    scoreCard.className = "score-card";

    var pointsGroup = document.createElement("div");
    pointsGroup.className = "points-group";

    var minusBtn = document.createElement("button");
    minusBtn.type = "button";
    minusBtn.className = "step-btn";
    minusBtn.textContent = "−";
    minusBtn.setAttribute("aria-label", "ลดคะแนน");

    var pointsInput = document.createElement("input");
    pointsInput.type = "number";
    pointsInput.className = "points-input";
    pointsInput.value = team.points;
    pointsInput.step = "1";
    pointsInput.inputMode = "numeric";

    var plusBtn = document.createElement("button");
    plusBtn.type = "button";
    plusBtn.className = "step-btn";
    plusBtn.textContent = "+";
    plusBtn.setAttribute("aria-label", "เพิ่มคะแนน");

    function commitPoints(v) {
      var t = findTeam(team.id);
      if (!t) return;
      var n = parseInt(v, 10);
      if (isNaN(n)) n = 0;
      t.points = n;
      pointsInput.value = n;
      save();
    }
    pointsInput.addEventListener("input", function () { commitPoints(pointsInput.value); });
    minusBtn.addEventListener("click", function () { commitPoints((parseInt(pointsInput.value, 10) || 0) - 1); });
    plusBtn.addEventListener("click", function () { commitPoints((parseInt(pointsInput.value, 10) || 0) + 1); });

    var ptsLabelWrap = document.createElement("div");
    ptsLabelWrap.style.display = "flex";
    ptsLabelWrap.style.flexDirection = "column";
    ptsLabelWrap.style.alignItems = "center";
    ptsLabelWrap.appendChild(pointsInput);
    var ptsLabel = document.createElement("div");
    ptsLabel.className = "pts-label";
    ptsLabel.textContent = "pts";
    ptsLabelWrap.appendChild(ptsLabel);

    pointsGroup.appendChild(minusBtn);
    pointsGroup.appendChild(ptsLabelWrap);
    pointsGroup.appendChild(plusBtn);
    scoreCard.appendChild(pointsGroup);

    var tokenGroup = document.createElement("div");
    tokenGroup.className = "token-group";

    var tokenCycle = document.createElement("button");
    tokenCycle.type = "button";
    tokenCycle.className = "token-cycle";
    tokenCycle.setAttribute("aria-label", "เปลี่ยนไอคอนรางวัล");
    var tokenIconSpan = document.createElement("span");
    tokenIconSpan.className = "token-icon";
    tokenIconSpan.innerHTML = TOKEN_ICONS[team.tokenType] || TOKEN_ICONS.star;
    tokenCycle.appendChild(tokenIconSpan);
    tokenCycle.addEventListener("click", function () {
      var t = findTeam(team.id);
      if (!t) return;
      var idx = TOKEN_TYPES.indexOf(t.tokenType);
      t.tokenType = TOKEN_TYPES[(idx + 1) % TOKEN_TYPES.length];
      tokenIconSpan.innerHTML = TOKEN_ICONS[t.tokenType];
      accessory.innerHTML = ACCESSORY_ICONS[t.tokenType];
      save();
    });

    var tokenCount = document.createElement("input");
    tokenCount.type = "number";
    tokenCount.className = "token-count";
    tokenCount.value = team.tokenCount;
    tokenCount.inputMode = "numeric";
    tokenCount.addEventListener("input", function () {
      var t = findTeam(team.id);
      if (!t) return;
      var n = parseInt(tokenCount.value, 10);
      if (isNaN(n)) n = 0;
      t.tokenCount = n;
      save();
    });

    tokenGroup.appendChild(tokenCycle);
    tokenGroup.appendChild(tokenCount);
    scoreCard.appendChild(tokenGroup);

    card.appendChild(scoreCard);
    return card;
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    state.teams.forEach(function (team) {
      boardEl.appendChild(buildCard(team));
    });

    var addCard = document.createElement("button");
    addCard.type = "button";
    addCard.className = "add-card";
    addCard.innerHTML = '<span class="plus-circle">+</span><span>เพิ่มทีมใหม่</span>';
    addCard.addEventListener("click", function () {
      var color = PALETTE[state.teams.length % PALETTE.length];
      var tokenType = TOKEN_TYPES[state.teams.length % TOKEN_TYPES.length];
      var team = { id: "t" + nextIdCounter++, name: "New Team", color: color, points: 0, tokenType: tokenType, tokenCount: 0 };
      state.teams.push(team);
      save();
      renderBoard();
      var cards = boardEl.querySelectorAll(".team-name");
      var last = cards[cards.length - 1];
      if (last) {
        var range = document.createRange();
        range.selectNodeContents(last);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        last.focus();
      }
    });
    boardEl.appendChild(addCard);
  }

  document.getElementById("addTeamBtn").addEventListener("click", function () {
    document.querySelector(".add-card").click();
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!window.confirm("รีเซ็ตคะแนนและเหรียญของทุกทีมกลับเป็นค่าเริ่มต้นใช่ไหม?")) return;
    state = { title: "Village Builders Scoreboard", teams: defaultTeams() };
    titleEl.textContent = state.title;
    save();
    renderBoard();
  });

  renderBoard();
})();
</script>
</body>
</html>
